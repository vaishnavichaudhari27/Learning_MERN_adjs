<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let prom = new Promise(function(resolve,reject){
            let condition = true;

            if(condition){
                resolve("Promiss Fulfilled Successfuly");

            }else {
                reject("Promiss Rejected")
            }

        }); 
        let onFulfilment = (result) =>{
            console.log(result);
        }
        let onRejection = (error) =>{
            console.log(error);
        }

        // prom.then(onFulfilment);
        // prom.catch(onRection);

        prom.finally(()=>{
            console.log("Promise operation finished");

            prom
            .then(onFulfilment)
            .catch(onRejection)
        });



    </script>

    <script>
        let Promise2 = new Promise(resolve,reject) => {
            console.log("Fetching data......");

            setTimeout(() => {
                let dataAvailable = true;

                if(dataAvailable){
                    resolve("data recived from server");
                }else{
                    reject("Server Error....");
                }
            }
        },5000;  //5 second dealy);
        Promise2
        .then(res=>console.log(res))
        .catch(err=>console.log(err))
        .finally(()=>console.log("Request coming from server"));
    </script>
</body>
</html>
